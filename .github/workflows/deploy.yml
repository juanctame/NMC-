name: Deploy site (GitHub Pages)

# Builds the Expo web bundle and publishes it to the `gh-pages` branch on every
# push to a deploy branch — so the public site at https://juanctame.github.io/NMC-/
# stays current automatically (no hand-built deploys). `main` is the canonical
# production branch; the feature branch also deploys so work is previewable live.
#
# This uses classic branch-based Pages (Settings → Pages → Source =
# "Deploy from a branch" → gh-pages / root) rather than the Actions "environment"
# deploy, because that environment restricts deployments to the default branch —
# the branch-push approach here deploys from either branch.

on:
  push:
    branches: [main, claude/modern-app-interface-design-ax8tbd]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
  workflow_dispatch:

# The built-in token needs write access to push the built site to gh-pages.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Export web bundle
        run: npx expo export -p web
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll        # keep GitHub Pages from hiding the _expo/ dir
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
