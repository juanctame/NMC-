name: Deploy site (GitHub Pages)

# Builds the Expo web bundle and publishes it to the `gh-pages` branch on every
# push to a deploy branch — so the public site at https://juanctame.github.io/NMC-/
# stays current automatically (no hand-built deploys). `main` is the canonical
# production branch; the feature branch also deploys so work is previewable live.
#
# This uses classic branch-based Pages (Settings → Pages → Source =
# "Deploy from a branch" → gh-pages / root) rather than the Actions "environment"
# deploy, because that environment restricts deployments to the default branch —
# the branch-push approach here deploys from either branch.
#
# Before building, it refreshes src/data/media.json — link-preview images for
# every restaurant (official site, Guía Michelin, press) — when the manifest is
# older than a week (or on demand), and saves the refreshed manifest back to the
# branch. Collection needs open internet, which CI has; failures never block a
# deploy (the app falls back to freely-licensed and generated covers).

on:
  push:
    branches: [main, claude/modern-app-interface-design-ax8tbd]
    paths-ignore:
      - '**.md'
      - 'supabase/**'
  schedule:
    - cron: '17 9 * * *' # daily (runs on the default branch): refresh clips within the YouTube quota
  workflow_dispatch:
    inputs:
      force_media:
        description: 'Re-collect restaurant media even if the manifest is fresh'
        type: boolean
        default: false

# The built-in token needs write access to push the built site to gh-pages.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect restaurant media (sites, guides, press)
        run: node scripts/collect-media.mjs
        continue-on-error: true
        env:
          FORCE: ${{ github.event.inputs.force_media == 'true' && '1' || '' }}
      - name: Collect creator clips (YouTube, by hashtag; third-party, HD)
        run: node scripts/collect-videos.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Export web bundle
        run: npx expo export -p web
      - name: Save refreshed media + clip manifests to the branch
        continue-on-error: true
        run: |
          if git diff --quiet -- src/data/media.json src/data/videos.json; then echo "manifests unchanged"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/media.json src/data/videos.json
          git commit -q -m "Refresh restaurant media + clip manifests [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll        # keep GitHub Pages from hiding the _expo/ dir
          cd dist
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
