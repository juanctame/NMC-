name: Fetch a critic's Google My Maps list

# Downloads a public Google My Maps map as KML (the map's own export) into
# src/data/critics/, so a house critic's list can be imported from it.
on:
  push:
    branches: [claude/modern-app-interface-design-ax8tbd]
    paths: ['.github/workflows/fetch-critic-map.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KML
        run: |
          MID=1UbVGXz0IAO4ogOnXpBekYzzxeEg44II
          OUT=src/data/critics/tametitoeats.map.kml
          curl -sS -L -m 60 -A "Mozilla/5.0" -o "$OUT" -w "%{http_code} %{content_type} %{size_download}\n" "https://www.google.com/maps/d/kml?mid=$MID&forcekml=1"
          head -c 600 "$OUT"; echo
          grep -c "<Placemark" "$OUT" || true
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/critics
          git commit -q -m "Fetch @tametitoeats map KML [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
